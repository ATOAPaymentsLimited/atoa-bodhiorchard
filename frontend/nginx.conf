server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload size cap. Slightly above the backend's 10 MB evidence
    # ceiling (``MAX_FILE_SIZE`` in ``app/services/file_storage.py``)
    # so an at-the-limit upload reaches the backend and gets a clean
    # JSON 413 ``{"detail": "File exceeds 10 MB limit"}`` instead of
    # nginx's HTML ``413 Request Entity Too Large`` page, which the
    # frontend can't usefully render to the user. nginx's default is
    # 1 MB — every multi-megabyte screenshot hit that wall silently.
    client_max_body_size 12M;

    # Docker's embedded DNS. Without this + runtime-resolved upstreams
    # below, nginx caches the backend/multiplayer IPs at startup — so
    # `docker compose up --force-recreate backend` (which gives the
    # backend a new IP) strands nginx talking to the old IP (often
    # reassigned to another container), manifesting as 502 "Connection
    # refused" until nginx is reloaded. `valid=10s` is short enough to
    # pick up container restarts quickly without DNS pressure.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API proxy. The `set $backend_upstream ...` trick forces nginx to
    # resolve the hostname per-request using the resolver above instead
    # of caching it forever at config load.
    location /api/ {
        set $backend_upstream "backend";
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP remote endpoint — long-lived SSE stream for external AI clients
    # (Claude Desktop / Cursor / Continue) per the streamable-http spec.
    # Must be matched BEFORE the generic /mcp/ block below because nginx
    # picks the most specific prefix; the SSE-specific tweaks here only
    # apply to this path, not to the short-lived /mcp/tools/* POSTs.
    #
    # Three SSE-critical settings vs the generic block:
    #   * proxy_buffering off — events must reach the client immediately,
    #     not pool in nginx's buffer until full. Belt-and-braces with the
    #     ``X-Accel-Buffering: no`` header the backend sets.
    #   * proxy_read_timeout 24h — the stream is intentionally long-lived
    #     (heartbeats every 30 s); the default 5-min ceiling would drop
    #     idle-but-healthy connections.
    #   * gzip off — gzip would coalesce/delay individual ``data:`` events,
    #     breaking event-framing on the client side.
    location /mcp/sse {
        set $mcp_sse_upstream "backend";
        proxy_pass http://$mcp_sse_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP bridge endpoints. The stdio bridge shipped into each example
    # repo (.bodhiorchard/mcp_bridge.py) calls /mcp/tools (GET) and
    # /mcp/tools/{name} (POST) on the backend. Without this block those
    # requests fall into the SPA fallback below and return index.html,
    # which the bridge tries to JSON-parse and fails. Bearer-token auth
    # is enforced server-side by FastAPI, so this mirrors /api/'s posture.
    location /mcp/ {
        set $mcp_backend_upstream "backend";
        proxy_pass http://$mcp_backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Colyseus multiplayer — HTTP matchmaking (POST /matchmake/joinOrCreate/*)
    # and the WebSocket upgrade. Path is /colyseus/ in both Hybrid (Vite dev
    # proxy in vite.config.ts) and Full Docker (this block) so the client's
    # resolveColyseusUrl() doesn't need to branch on environment.
    #
    # Note: with a variable in proxy_pass (needed for runtime DNS — see
    # resolver above) nginx does NOT do its usual location-prefix strip.
    # We `rewrite` the /colyseus/ prefix off explicitly so Colyseus sees
    # the URIs it expects (/matchmake/..., /matchmake/joinOrCreate/..., etc.).
    location /colyseus/ {
        set $multiplayer_upstream "multiplayer";
        rewrite ^/colyseus/(.*)$ /$1 break;
        proxy_pass http://$multiplayer_upstream:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Content-hashed build assets (Vite emits /assets/<name>-<hash>.{js,css}).
    # Two rules here, both fixing the post-deploy blank-screen bug:
    #
    #   1. `try_files $uri =404` — a request for an asset hash that no longer
    #      exists (e.g. a returning user whose cached index.html still points
    #      at the previous build) MUST 404. Without this it falls through to
    #      the SPA fallback below and gets index.html (text/html, 200); the
    #      browser then rejects "HTML as a JS module" and the app never boots
    #      — a permanent blank page until the user manually clears cache.
    #   2. `immutable` long cache — the hash IS the cache key, so these are
    #      safe to cache forever; only index.html gates which hashes load.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback. index.html MUST NOT be cached: it's the manifest that
    # names the current asset hashes. If a browser caches it, a later deploy
    # rotates the hashes and deletes the old files, leaving the stale HTML
    # pointing at assets that now 404 → blank screen. `no-cache` forces a
    # revalidation (cheap 304 via etag) on every load so clients always pick
    # up the freshly-deployed asset names.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
